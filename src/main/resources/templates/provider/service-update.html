<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Update Service</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
    <a class="navbar-brand" href="#">
        <img src="/logo.jpg" alt="G4 Logo" class="navbar-logo" style="height: 50px;">
    </a>
    <div class="container-fluid">
        <a class="navbar-brand text-white" th:href="@{/services/user(userId=${userId})}">Provider Dashboard</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" th:href="@{/users/profile(userId=${userId})}">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="/users/logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header text-center bg-info text-white">
                    <h2>Update Service</h2>
                </div>
                <div class="card-body">
                    <form action="/services/update" method="post">
                        <div class="mb-3">
                            <label for="serviceId" class="form-label">Service ID</label>
                            <input type="number" class="form-control" id="serviceId" name="serviceId" data-th-value="${service.serviceId}" readonly />
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">Service Name</label>
                            <input type="text" class="form-control" id="title" name="title" data-th-value="${service.title}" placeholder="Service Name" required />
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" placeholder="Description" data-th-text="${service.description}" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="price" class="form-label">Price</label>
                            <input type="number" class="form-control" id="price" name="price" data-th-value="${service.price}" placeholder="Price" required />
                        </div>
                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location" data-th-value="${service.location}" placeholder="Location" required />
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" name="category" data-th-value="${service.category}" placeholder="Category" required />
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="" disabled selected>Select Status</option>
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="imagePath" class="form-label">Upload Image</label>
                            <input type="file" class="form-control" id="imagePath" name="imagePath" accept="image/*" />
                        </div>
                        <div class="mb-3 text-center">
                            <label>Current Image:</label>
                            <div>
                                <img th:src="@{'/image/' +${service.imagePath}}" alt="Service Image" class="img-fluid img-thumbnail" style="max-height: 200px;" />
                            </div>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                            <a  th:href="@{/services/user(userId=${userId})}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
