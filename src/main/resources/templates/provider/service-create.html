<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/styles/styles.css" type="text/css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <title>Create New Service</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
  <div class="container-fluid">
    <a class="navbar-brand text-white"  th:href="@{/services/user(userId=${userId})}">Service Dashboard</a>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" href="/users/profile">Profile</a></li>
      <li class="nav-item"><a class="nav-link" href="/users/logout">Logout</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg">
        <div class="card-header text-center bg-info text-white">
          <h2>Create New Service</h2>
        </div>
        <div class="card-body">
          <form action="#" th:action="@{/services/new/{id} (id=${service.userId})}" method="post" class="row g-3" >

            <!-- Service Title -->
            <div class="col-md-6">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" name="title" placeholder="Service Title" required>
            </div>

            <!-- Image Path -->
            <div class="col-md-6">
              <label for="imagePath">Upload Image:</label>
              <input type="file" class="form-control mb-2" id="imagePath" name="imagePath" accept="image/*" />
            </div>

            <!-- Price -->
            <div class="col-md-6">
              <label for="price" class="form-label">Price</label>
              <input type="number" step="0.01" class="form-control" id="price" name="price" placeholder="Price" required>
            </div>

            <!-- Description -->
            <div class="col-md-12">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" name="description" rows="3" placeholder="Description" required></textarea>
            </div>

            <!-- Location -->
            <div class="col-md-6">
              <label for="location" class="form-label">Location</label>
              <input type="text" class="form-control" id="location" name="location" placeholder="Location" required>
            </div>

            <!-- Category -->
            <div class="col-md-6">
              <label for="category" class="form-label">Category</label>
              <input type="text" class="form-control" id="category" name="category" placeholder="Category" required>
            </div>

            <!-- Status -->
            <div class="col-md-6">
              <label for="status" class="form-label">Status</label>
              <select class="form-select" id="status" name="status" required>
                <option value="" disabled selected>Select Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div class="col-12 text-center">
              <button type="submit" class="btn btn-primary">Create Service</button>
              <a  th:href="@{/services/user(userId=${userId})}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
