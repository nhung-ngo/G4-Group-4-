<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Bookings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2>Reservations for Service</h2>
  <table class="table table-bordered">
    <thead>
    <tr>
      <th>Booking ID</th>
      <th>User Name</th>
      <th>Total Payment</th>
      <th>Status</th>
      <th>Confirm
      <th>Cancel</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="booking : ${bookings}">
      <td th:text="${booking.bookingID}"></td>
      <td th:text="${booking.user.name}"></td>
      <td th:text="${booking.totalPayment}"></td>
      <td th:text="${booking.status}"></td>
      <td>
        <form data-th-action="@{/booking/provider/confirm/{bookingId}(bookingId=${booking.bookingID})}" method="post">
          <button class="btn btn-success" th:if="${booking.status.equals('pending')}" type="submit">
            Confirm
          </button>
        </form>
      </td>
      <td>
        <form data-th-action="@{/booking/provider/cancel/{bookingId}(bookingId=${booking.bookingID})}" method="post">
          <button class="btn btn-success" th:if="${booking.status.equals('pending')}" type="submit">
            Cancel
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
  <a th:href="@{/services/{serviceId}(serviceId=${serviceId})}" class="btn btn-primary">Back to Service Details</a>
</div>
</body>
</html>
