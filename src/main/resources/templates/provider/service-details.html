<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <title>Service Details</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-primary mb-3">
  <div class="container-fluid">
    <a class="navbar-brand text-white"  th:href="@{/services/user(userId=${userId})}">Provider Dashboard</a>
    <ul class="nav justify-content-end">
      <li class="nav-item">
        <a class="nav-link active text-white" aria-current="page"  th:href="@{/services/user(userId=${userId})}">Home</a>
      </li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="card mt-5">
    <div class="card-header">
      <h3>Service Details</h3>
    </div>
    <div class="card-body">
      <div class="text-center mb-4">
        <img data-th-src="@{'/image/' + ${service.imagePath}}" alt="Service Image" class="img-fluid" style="max-width: 400px; max-height: 300px;" />
      </div>
      <p><strong>Service Name:</strong> <span data-th-text="${service.title}"></span></p>
      <p><strong>Description:</strong> <span data-th-text="${service.description}"></span></p>
      <p><strong>Price:</strong> <span data-th-text="${service.price}"></span></p>
      <p><strong>Location:</strong> <span data-th-text="${service.location}"></span></p>
      <p><strong>Category:</strong> <span data-th-text="${service.category}"></span></p>
      <p><strong>Status:</strong> <span data-th-text="${service.status}"></span></p>
      <a data-th-href="@{/services/update/{serviceId}(serviceId=${service.serviceId})}" class="btn btn-warning">Edit Service</a>
      <a  th:href="@{/services/user(userId=${userId})}" class="btn btn-secondary">Back to All Services</a>
    </div>
  </div>
</div>

<h2>Reviews</h2>
<div th:if="${reviews.isEmpty()}">
  <p>No reviews yet.</p>
</div>

<div th:each="review : ${reviews}">
  <p><strong>Rating:</strong> <span th:text="${review.rating}">0</span></p>
  <p><strong>Comment:</strong> <span th:text="${review.reviews}">Review content</span></p>
  <p><strong>By:</strong> <span th:text="${review.user.name}">User</span></p>
  <div class="card-footer d-flex justify-content-between">
    <td><a th:href="@{/reviews/{reviewId}(reviewId=${review.reviewId})}" class="btn btn-warning btn-sm">View</a></td>

  </div>

  <ul>
  </ul>
  <hr />

</div>

</body>
</html>
