<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <title>Services List</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
  <div class="container-fluid">
    <a class="navbar-brand text-white" th:href="@{/services/user(userId=${userId})}">Provider Dashboard</a>
    <ul class="nav bar">

      <li class="nav-item">
        <a class="nav-link active text-white" aria-current="page" th:href="@{/services/home}">Home</a>
      </li>
      <li class="nav-item"><a class="nav-link" href="/users/profile">Profile</a></li>
      <li class="nav-item"><a class="nav-link" href="/users/logout">Logout</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-between align-items-center mb-3">
    <div class="col">
      <h1 class="display-4" data-th-text="${title}">Services List</h1>
    </div>
    <div class="col-auto">
      <form class="d-flex" action="/services/search" method="get">
        <input class="form-control me-2" type="text" name="title" placeholder="Search By Title &#128270;">
      </form>
    </div>
  </div>

  <!-- Services displayed as cards -->
  <div class="row row-cols-1 row-cols-md-3 g-4" th:each="service : ${serviceList}">
    <div class="col">
      <div class="card h-100 shadow-sm">
        <img th:src="@{'/image/' + ${service.imagePath}}" class="card-img-top" alt="Service Image" style="height: 200px; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title" th:text="${service.title}"></h5>
          <p class="card-text" th:text="${service.description}"></p>
          <p class="card-text"><strong>Price:</strong> $<span th:text="${service.price}"></span></p>
          <p class="card-text"><strong>Location:</strong> <span th:text="${service.location}"></span></p>
          <p class="card-text"><strong>Status:</strong> <span th:text="${service.status}"></span></p>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <td><a th:href="@{/services/{serviceId}(serviceId=${service.serviceId})}" class="btn btn-warning btn-sm">View</a></td>
          <a th:href="@{/services/update/{serviceId}(serviceId=${service.serviceId})}" class="btn btn-warning btn-sm">Edit</a>
          <a th:href="@{/services/delete/{serviceId}(serviceId=${service.serviceId})}" class="btn btn-danger btn-sm">Delete</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Button to trigger modal for adding a new service -->
  <div class="mt-4 text-center">
    <a th:href="@{/services/create(userId=${userId})}" class="btn btn-outline-primary">Create Service</a>

  </div>


</div>


</body>
</html>
