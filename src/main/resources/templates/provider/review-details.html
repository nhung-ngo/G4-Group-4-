<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <title>Review Details</title>

  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>


<div class="container" style="margin-top: 15px;">
  <h1 th:text="${title}"></h1>
  <div class="card">

    <h5 class="card-header" style="background-color:#F6EEC9;">
      Review Details
    </h5>
    <div class="card-body" style="background-color:#F6EEC9;">
      <p><strong>Review ID:</strong> <span th:text="${review.reviewID}"></span></p>
      <p><strong>Content:</strong> <span th:text="${review.reviews}"></span></p>
      <p><strong>Author:</strong> <span th:text="${review.user.name}"></span></p>
      <a th:href="@{/services/{serviceId}(serviceId=${review.service.serviceId})}" class="btn btn-primary">
        Back to Service Details
      </a>
    </div>
  </div>

  <h3 style="margin-top: 20px;">Replies</h3>
  <div class="scrollable" style="height: 250px; overflow-y: auto; margin-bottom: 20px;">
    <table class="table table-striped rounded-3">
      <thead>
      <tr>
        <th>Reply ID</th>
        <th>Content</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="reply : ${replies}">
        <td th:text="${reply.replyID}"></td>
        <td th:text="${reply.content}"></td>
        <td>
          <a th:href="@{/replies/delete/{id} (id=${reply.replyID})}" class="btn btn-danger">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <h3>Post a Reply</h3>
  <form th:action="@{/replies/review/{reviewID} (reviewID=${review.reviewID})}" method="post">
    <div class="mb-3">
      <label for="content" class="form-label">Reply Content</label>
      <textarea class="form-control" id="content" name="content" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Post Reply</button>
  </form>
</div>

</body>
</html>
