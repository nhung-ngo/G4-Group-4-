<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Service Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #F6EEC9;">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
    <a class="navbar-brand" href="/">Travel Services</a>
    <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/services/home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/users/profile">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="/users/logout">Logout</a></li>
    </ul>
</nav>

<div class="card-body">
    <div class="text-center mb-4">
        <img data-th-src="@{'/image/' + ${service.imagePath}}" alt="Service Image" class="img-fluid" style="max-width: 400px; max-height: 300px;" />
    </div>
    <p><strong>Service Name:</strong> <span data-th-text="${service.title}"></span></p>
    <p><strong>Description:</strong> <span data-th-text="${service.description}"></span></p>
    <p><strong>Price:</strong> <span data-th-text="${service.price}"></span></p>
    <p><strong>Location:</strong> <span data-th-text="${service.location}"></span></p>
    <p><strong>Category:</strong> <span data-th-text="${service.category}"></span></p>
    <p><strong>Status:</strong> <span data-th-text="${service.status}"></span></p>
</div>

<!-- Reservation Form -->
<h2>Make a Reservation</h2>
<form th:action="@{/services/{serviceId}/reserve(serviceId=${service.serviceId})}" method="post">
    <div class="mb-3">
        <label for="reservationDate" class="form-label">Reservation Date</label>
        <input type="date" id="reservationDate" name="reservationDate" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="guests" class="form-label">Number of Guests</label>
        <input type="number" id="guests" name="guests" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Reserve Now</button>
</form>

<!-- Payment Form -->
<h2>Make a Payment</h2>
<form th:action="@{/services/{serviceId}/payment(serviceId=${service.serviceId})}" method="post">
    <div class="mb-3">
        <label for="amount" class="form-label">Amount</label>
        <input type="number" id="amount" name="amount" class="form-control" step="0.01" required>
    </div>
    <button type="submit" class="btn btn-success">Pay Now</button>
</form>

<!-- Success Message -->
<div th:if="${message}" class="alert alert-success mt-3">
    <p th:text="${message}"></p>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
