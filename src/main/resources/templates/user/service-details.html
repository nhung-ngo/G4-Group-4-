<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Service Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
    <h1 class="navbar-brand" href="/">Travel Services</h1>
    <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" th:href="@{/services/home(userId=${userId})}">Home</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/users/profile(userId=${userId})}">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="/users/logout">Logout</a></li>
    </ul>
</nav>


<div class="container" style="margin-top: 15px;">
    <h1 th:text="${title}"></h1>
    <div class="card">
        <h5 class="card-header" style="background-color:#F6EEC9;">
            Service Details
        </h5>
        <div class="card-body" style="background-color:#F6EEC9;">
            <div class="text-center mb-4">
                <img data-th-src="@{'/image/' + ${service.imagePath}}" alt="Service Image" class="img-fluid" style="max-width: 400px; max-height: 300px;" />
            </div>
            <p><strong>Service Name:</strong> <span data-th-text="${service.title}"></span></p>
            <p><strong>Description:</strong> <span data-th-text="${service.description}"></span></p>
            <p><strong>Price:</strong> <span data-th-text="${service.price}"></span></p>
            <p><strong>Location:</strong> <span data-th-text="${service.location}"></span></p>
            <p><strong>Category:</strong> <span data-th-text="${service.category}"></span></p>
            <p class="card-text"><strong>Created By:</strong> <span data-th-text="${service.user.name}"></span></p>
            <p><strong>Status:</strong> <span data-th-text="${service.status}"></span></p>
        </div>
    </div>
    <!--Reservation Form-->
    <td><a th:href="@{/booking/new/{serviceId}/user/{userId}(serviceId=${service.serviceId}, userId=${userId})}" class="btn btn-warning btn-sm">Reservce</a></td>

    <h3 style="margin-top: 20px;">Reviews</h3>
    <div th:if="${reviews.isEmpty()}" >
        <p>No reviews yet.</p>
    </div>

    <div class="scrollable" style="height: 250px; overflow-y: auto; margin-bottom: 20px;">
        <table class="table table-striped rounded-3">
            <thead>

            <tr>
                <th>Rating</th>
                <th>Comment</th>
                <th>By: </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
                <td th:text="${review.rating}"></td>
                <td th:text="${review.reviews}"></td>
                <td th:text="${review.user.name}"></td>

            </tr>
            </tbody>
        </table>

        <h3>Post Review</h3>
        <form th:action="@{/reviews/reviews}" method="post">
            <input type="hidden" name="serviceId" th:value="${serviceId}" />
            <input type="hidden" name="userId" th:value="${userId}" />

            <div class="mb-3">
                <label for="rating" class="form-label">Rating</label>
                <select class="form-select" id="rating" name="rating" required>
                    <option value="" disabled selected>Select a rating</option>
                    <option value="1">1 - Poor</option>
                    <option value="2">2 - Fair</option>
                    <option value="3">3 - Good</option>
                    <option value="4">4 - Very Good</option>
                    <option value="5">5 - Excellent</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="reviews" class="form-label">Comment</label>
                <textarea class="form-control" id="reviews" name="reviews" rows="3" placeholder="Write your review here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Review</button>
        </form>
    </div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
