<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Services</title>
    <style>
        .profile-icon {
            font-size: 1.5em;
        }
        .profile-icon-container {
        position: relative;
        cursor: pointer;
        }
        .dropdown-menu {
        display: none;
        position: absolute;
        top: 40px;
        right: 0;
        background-color: #fff;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
        overflow: hidden;
        z-index: 10;
        width: 150px;
    }

    .dropdown-menu a {
        display: block;
        padding: 10px;
        color: #333;
        text-decoration: none;
    }

    .dropdown-menu a:hover {
        background-color: #f0f0f0;
    }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</head>
<body>
<!-- Navigation Bar -->
<header class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
    <div><img src="/logo.jpg" alt="G4 Logo" class="navbar-logo" style="height: 50px;"></div>
    <form th:action="@{/services/category/{userId}/search(userId=${userId})}" method="get" class="d-flex">
        <input type="text" name="category" placeholder="Search services by category..." class="form-control w-50 ms-3" />
        <input type="hidden" name="userId" th:value="${userId}" />
        <button type="submit" class="btn btn-primary ms-2">Search</button>
    </form>
    <div class="ms-auto d-flex align-items-center">
        <a class="btn btn-light me-3"  th:href="@{/services/user(userId=${userId})}" >Switch to Host</a>
        <div class="profile-icon-container">
            <div class="profile-icon" onclick="toggleDropdown()">👤</div>
            <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
                <a th:href="@{/users/profile(userId=${userId})}">Profile</a>
                <a th:href="@{/booking/history(userId=${userId})}">Booking History</a>
                <a href="/users/logout">Log Out</a> <!-- Log Out redirects to login -->
            </div>
        </div>
    </div>
</header>

<!-- Category Tabs -->


<!-- Service Grid -->
<div class="row row-cols-1 row-cols-md-3 g-4" th:each="service : ${serviceList}">
    <div class="col">
        <div class="card h-100 shadow-sm">
            <img th:src="@{'/image/' + ${service.imagePath}}" class="card-img-top" alt="Service Image" style="height: 200px; object-fit: cover;">
            <div class="card-body">
                <h5 class="card-title" th:text="${service.title}"></h5>
                <p class="card-text" th:text="${service.description}"></p>
                <p class="card-text"><strong>Price:</strong> $<span th:text="${service.price}"></span></p>
                <p class="card-text"><strong>Location:</strong> <span th:text="${service.location}"></span></p>
                <p class="card-text"><strong>Status:</strong> <span th:text="${service.status}"></span></p>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <td><a th:href="@{/services/{serviceId}/user/{userId}(serviceId=${service.serviceId}, userId=${userId})}" class="btn btn-warning btn-sm">View</a></td>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    function toggleDropdown() {
        const dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
</script>
</body>
</html>
