<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Services</title>
    <link rel="stylesheet" href="home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<!-- Navigation Bar -->
<header class="navbar navbar-expand-lg navbar-light bg-primary mb-3">
    <div class="logo text-white">G4</div>
    <input type="text" placeholder="Search services..." class="form-control w-50 ms-3">
    <div class="ms-auto d-flex align-items-center">
        <a class="btn btn-light me-3"  th:href="@{/services/user(userId=${userId})}" >Switch to Host</a>
        <div class="profile-icon-container">
            <div class="profile-icon text-white" onclick="toggleDropdown()">👤</div>
            <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
                <a href="/users/profile">Profile</a>
                <a href="/users/logout">Log Out</a> <!-- Log Out redirects to login -->
            </div>
        </div>
    </div>
</header>

<!-- Category Tabs -->


<!-- Service Grid -->
<div class="row row-cols-1 row-cols-md-3 g-4" th:each="service : ${serviceList}">
    <div class="col">
        <div class="card h-100 shadow-sm">
            <img th:src="@{'/image/' + ${service.imagePath}}" class="card-img-top" alt="Service Image" style="height: 200px; object-fit: cover;">
            <div class="card-body">
                <h5 class="card-title" th:text="${service.title}"></h5>
                <p class="card-text" th:text="${service.description}"></p>
                <p class="card-text"><strong>Price:</strong> $<span th:text="${service.price}"></span></p>
                <p class="card-text"><strong>Location:</strong> <span th:text="${service.location}"></span></p>
                <p class="card-text"><strong>Status:</strong> <span th:text="${service.status}"></span></p>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <td><a th:href="@{/services/{serviceId}(serviceId=${service.serviceId})}" class="btn btn-warning btn-sm">View</a></td>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    function toggleDropdown() {
        const dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
</script>
</body>
</html>
