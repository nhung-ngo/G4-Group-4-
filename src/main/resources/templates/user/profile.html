<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        .profile-icon {
            font-size: 1.5em;
        }
        .profile-icon-container {
        position: relative;
        cursor: pointer;
        }
        .dropdown-menu {
        display: none;
        position: absolute;
        top: 40px;
        right: 0;
        background-color: #fff;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
        overflow: hidden;
        z-index: 10;
        width: 150px;
    }

    .dropdown-menu a {
        display: block;
        padding: 10px;
        color: #333;
        text-decoration: none;
    }

    .dropdown-menu a:hover {
        background-color: #f0f0f0;
    }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: #f8f9fa;">

<!-- Header -->
<header class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/services/home(userId=${userId})}">
            <img src="/logo.jpg" alt="G4 Logo" class="navbar-logo" style="height: 50px;">
        </a>
        <div class="ms-auto d-flex align-items-center">
            <a class="btn btn-light me-3" th:href="@{/services/user(userId=${userId})}">Switch to Host</a>
            <div class="profile-icon-container">
                <div class="profile-icon text-white" onclick="toggleDropdown()">👤</div>
                <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
                    <a th:href="@{/users/profile(userId=${userId})}">Profile</a>
                    <a th:href="@{/booking/history(userId=${userId})}">Booking History</a>
                    <a href="/users/login">Log Out</a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- User Profile Section -->
<div class="container">
    <div class="card mb-4">
        <div class="card-header bg-secondary text-white">
            <h3>User Profile</h3>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label"><strong>Name:</strong></label>
                <div class="col-sm-10">
                    <p class="form-control-plaintext" th:text="${user.name}"></p>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label"><strong>Email:</strong></label>
                <div class="col-sm-10">
                    <p class="form-control-plaintext" th:text="${user.email}"></p>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label"><strong>Status:</strong></label>
                <div class="col-sm-10">
                    <p class="form-control-plaintext" th:text="${user.status}"></p>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label"><strong>Actions:</strong></label>
                <div class="col-sm-10">
                    <a th:href="@{/users/edit(userId=${user.userId})}" class="btn btn-primary">Edit Profile</a>
                </div>

            </div>
        </div>
    </div>
</div>

<script >
    function toggleDropdown() {
        const dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
</script>
</body>
</html>
