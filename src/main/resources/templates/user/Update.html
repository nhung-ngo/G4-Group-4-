<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: #f8f9fa;">

<!-- Header -->
<header class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/logo.jpg" alt="G4 Logo" class="navbar-logo" style="height: 50px;">
    </a>
  </div>
</header>

<!-- User Update Form -->
<div class="container">
  <div class="card">
    <div class="card-header bg-secondary text-white">
      <h3>Update Profile</h3>
    </div>
    <div class="card-body">
      <form th:action="@{/users/update}" method="post" class="needs-validation" novalidate>
        <input type="hidden" name="userId" th:value="${user.userId}" />

        <div class="mb-3">
          <label for="name" class="form-label"><strong>Name:</strong></label>
          <input type="text" id="name" name="name" class="form-control"
                 th:value="${user.name}" required>
          <div class="invalid-feedback">
            Please enter your name.
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label"><strong>Email:</strong></label>
          <input type="email" id="email" name="email" class="form-control"
                 th:value="${user.email}" required>
          <div class="invalid-feedback">
            Please enter a valid email address.
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label"><strong>Password:</strong></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter a new password">
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-primary">Update</button>
          <a th:href="@{/users/profile(userId=${userId})}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Client-side form validation
  (function () {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(function (form) {
          form.addEventListener('submit', function (event) {
              if (!form.checkValidity()) {
                  event.preventDefault();
                  event.stopPropagation();
              }
              form.classList.add('was-validated');
          }, false);
      });
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
