<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking History</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #f9f9f9;">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Travel Services</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/services/home(userId=${userId})}">Home</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/users/profile(userId=${userId})}">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="/users/logout">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h1 class="mb-4">Booking History</h1>
  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="bg-primary text-white">
      <tr>
        <th>#</th>
        <th>Service Name</th>
        <th>Location</th>
        <th>Price</th>
        <th>Booking Status</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="booking, iterStat : ${bookings}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${booking.service.title}"></td>
        <td th:text="${booking.service.location}"></td>
        <td th:text="${booking.totalPayment}"></td>
        <td th:text="${booking.status}"></td>
        <td>
          <a th:href="@{/services/{serviceId}/user/{userId}(serviceId=${booking.service.serviceId}, userId=${userId})}" class="btn btn-info btn-sm">View Service</a>

        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
