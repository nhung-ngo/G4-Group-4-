<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics Overview</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">System Statistics Overview</h1>
    <div class="row g-4">
        <!-- Total Users Card -->
        <div class="col-md-3">
            <div class="card text-center border-success">
                <div class="card-body">
                    <h5 class="card-title text-success">Total Users</h5>
                    <p class="card-text h3" th:text="${totalUsers}"></p>
                </div>
            </div>
        </div>
        <!-- Total Bookings Card -->
        <div class="col-md-3">
            <div class="card text-center border-primary">
                <div class="card-body">
                    <h5 class="card-title text-primary">Total Bookings</h5>
                    <p class="card-text h3" th:text="${totalBookings}"></p>
                </div>
            </div>
        </div>
        <!-- Total Reviews Card -->
        <div class="col-md-3">
            <div class="card text-center border-warning">
                <div class="card-body">
                    <h5 class="card-title text-warning">Total Reviews</h5>
                    <p class="card-text h3" th:text="${totalReviews}"></p>
                </div>
            </div>
        </div>
        <!-- Total Replies Card -->
        <div class="col-md-3">
            <div class="card text-center border-danger">
                <div class="card-body">
                    <h5 class="card-title text-danger">Total Replies</h5>
                    <p class="card-text h3" th:text="${totalReplies}"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
