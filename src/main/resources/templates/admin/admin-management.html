<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manage User</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="background-color: #F6EEC9;">
<nav class="navbar navbar-expand-lg navbar-light bg-secondary">
  <a class="navbar-brand" href="#">
    <img src="/logo.jpg" alt="G4 Logo" class="navbar-logo" style="height: 50px;">
  </a>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link text-white" href="/stats/overview">Statistic</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="/users/all">Manage User</a>
      </li>
    </ul>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link text-white" href="/admin/logout">Logout</a>
      </li>
    </ul>
  </div>
</nav>

<div class="container mt-4">
  <!-- User List -->
  <div class="mb-5">
    <h3>User List</h3>
    <table class="table table-striped">
      <thead class="thead-light">
      <tr>
        <th>User ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr data-th-each="user : ${userList}">
        <td data-th-text="${user.userId}"></td>
        <td data-th-text="${user.name}"></td>
        <td data-th-text="${user.email}"></td>
        <td data-th-text="${user.status == 'banned' ? 'Banned' : 'Active'}"></td>
        <td>
          <form data-th-action="@{/users/ban/{userId}(userId=${user.userId})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-warning" data-th-if="${user.status != 'banned'}">Ban</button>
          </form>
          <form data-th-action="@{/users/unban/{userId}(userId=${user.userId})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-success" data-th-if="${user.status == 'banned'}">Unban</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
    <h3>Review List</h3>
    <table class="table table-striped">
      <thead class="thead-light">
      <tr>
        <th>Review ID</th>
        <th>Content</th>
        <th>Rating</th>
        <th>User ID</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr data-th-each="review : ${reviewList}">
        <td data-th-text="${review.reviewID}"></td>
        <td data-th-text="${review.reviews}"></td>
        <td data-th-text="${review.rating}"></td>
        <td data-th-text="${review.user.userId}"></td> <!-- Access userId through the User object -->
        <td>
          <!-- Delete Review -->
          <form data-th-action="@{/reviews/delete/{reviewId}(reviewId=${review.reviewID})}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>

          <!-- Ban User -->
          <form data-th-action="@{/users/ban/{userId}(userId=${review.user.userId})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-warning" data-th-if="${review.user.status != 'banned'}">Ban</button>
          </form>
        </td>
      </tr>
      </tbody>

    </table>


  </div>
</div>
</body>
</html>
