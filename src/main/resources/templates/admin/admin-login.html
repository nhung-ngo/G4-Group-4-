<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: #F6EEC9;">
<div class="container mt-5" style="margin-top: 100px; max-width: 400px;">
  <h1 style="color: #799351;">Admin Login</h1>
  <form data-th-action="@{/admin/login}" method="post" class="card p-4" style="border-color: #799351;">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="background-color: #799351;">Login</button>
    <div data-th-if="${error}" class="alert alert-danger mt-3" data-th-text="${error}"></div>
  </form>
</div>
</body>
</html>
